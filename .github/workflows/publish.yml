name: Publish verified release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag whose native packages passed
        required: true
        type: string
      run_id:
        description: Release build run with successful Windows, Linux and sources jobs
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: release-push-refs/tags/${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    concurrency:
      group: release-materials
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .publisher
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - name: Verify the tagged build and its successful jobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python - <<'PYCODE'
          import json, os, re, subprocess
          tag, run_id = os.environ['RELEASE_TAG'], os.environ['BUILD_RUN_ID']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag) or not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('Use an existing vMAJOR.MINOR.PATCH tag and numeric build run ID')
          repo = os.environ['GITHUB_REPOSITORY']
          endpoint = f'repos/{repo}/actions/runs/{run_id}'
          def api(path, paged=False):
              command = ['gh', 'api', path]
              if paged:
                  command += ['--paginate', '--slurp']
              return json.loads(subprocess.check_output(command, text=True))
          run = api(endpoint)
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if (run['repository']['full_name'] != repo or run['path'] != '.github/workflows/release.yml'
                  or run['event'] != 'push' or run['head_branch'] != tag or run['head_sha'] != commit
                  or run['status'] != 'completed' or run['conclusion'] not in ('success', 'failure')):
              raise SystemExit('Build run is not the completed release build for this exact tag')
          jobs = [job for page in api(endpoint + '/jobs?per_page=100', True) for job in page['jobs']]
          expected = {'build (ubuntu-22.04, linux)', 'build (windows-2022, windows)', 'sources'}
          for name in expected:
              matches = [job for job in jobs if job['name'] == name]
              if len(matches) != 1 or matches[0]['conclusion'] != 'success':
                  raise SystemExit('Required native build or sources job did not pass: ' + name)
          artifacts = [item for page in api(endpoint + '/artifacts?per_page=100', True) for item in page['artifacts']]
          names = {'app-linux', 'app-windows', 'sources', 'native-sources'}
          if len(artifacts) != len(names) or {item['name'] for item in artifacts} != names:
              raise SystemExit('Expected exactly the four verified release artifacts')
          if any(item['expired'] or item['size_in_bytes'] <= 0 for item in artifacts):
              raise SystemExit('A required release artifact is expired or empty')
          print('Verified native builds, source job and artifacts for', tag, commit)
          PYCODE
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release-assets')
          tag = os.environ['RELEASE_TAG']
          for suffix in ('windows-x86_64.zip', 'linux-x86_64.tar.gz', 'source.tar.gz'):
              if not (root / f'PDFWorkbench-{tag}-{suffix}').is_file():
                  raise SystemExit('Missing release asset: ' + suffix)
          manifest_path = root / 'source-manifest.json'
          sources = json.loads(manifest_path.read_text())
          renames = []
          destinations = set()
          for item in sources:
              filename = item['filename']
              path = root / filename
              if path.parent != root or not path.is_file():
                  raise SystemExit('Missing or unsafe corresponding source asset')
              normalized = re.sub(r'[^A-Za-z0-9._-]', '.', filename).strip('.')
              target = root / normalized
              if not normalized or normalized in destinations or (normalized != filename and os.path.lexists(target)):
                  raise SystemExit('Release source filename normalization collision')
              destinations.add(normalized)
              renames.append((item, path, target))
          for item, path, target in renames:
              if path != target:
                  os.link(path, target)
                  path.unlink()
                  item.setdefault('upstream_filename', item['filename'])
                  item['filename'] = target.name
          for item in sources:
              path = root / item['filename']
              if path.parent != root or not path.is_file() or path.stat().st_size != item['size']:
                  raise SystemExit('Missing or incomplete corresponding source asset')
              with path.open('rb') as stream:
                  digest = hashlib.sha256()
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
                  if digest.hexdigest() != item['sha256']:
                      raise SystemExit('Source asset checksum mismatch')
          manifest_path.write_text(json.dumps(sources, indent=2) + '\n', encoding='utf-8')
          PY
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish app downloads and a separate verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then notes="CHANGELOG.md"; fi
          python .publisher/packaging/publish_release.py create --tag "$RELEASE_TAG" --assets release-assets --notes-file "$notes"
