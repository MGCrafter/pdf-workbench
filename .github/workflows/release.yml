name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: packaging/requirements-release.txt
      - name: Check release tag
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          import sys
          sys.path.insert(0, 'src')
          from pdf_workbench import __version__
          if version != __version__ or (os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_REF_NAME'] != 'v' + version):
              raise SystemExit('Tag, pyproject.toml and app version must match')
          PY
      - name: Install Linux display libraries and Poppler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0
      - name: Prepare optional OCR engine for native Windows acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned UB-Mannheim build, SHA-256 recorded in Microsoft's WinGet manifest.
          # This engine is used by acceptance tests and is not added to the app bundle.
          $installer = Join-Path $env:RUNNER_TEMP 'tesseract-5.4.0.20240606.exe'
          Invoke-WebRequest -Uri 'https://github.com/UB-Mannheim/tesseract/releases/download/v5.4.0.20240606/tesseract-ocr-w64-setup-5.4.0.20240606.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'C885FFF6998E0608BA4BB8AB51436E1C6775C2BAFC2559A19B423E18678B60C9') { throw 'OCR installer checksum mismatch' }
          $process = Start-Process -FilePath $installer -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'OCR acceptance engine setup failed' }
          $engine = Join-Path $env:ProgramFiles 'Tesseract-OCR\tesseract.exe'
          if (-not (Test-Path -LiteralPath $engine)) { throw 'OCR acceptance engine is missing' }
          & $engine --version
          if ($LASTEXITCODE -ne 0) { throw 'OCR acceptance engine cannot run' }
          (Split-Path -Parent $engine) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r packaging/requirements-release.txt
      - name: Check Linux Qt platform dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin=$(python -c "from PyQt6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath) + '/platforms/libqxcb.so')")
          ldd "$plugin"
          if ldd "$plugin" | grep -q 'not found'; then exit 1; fi
      - name: Test the source
        env:
          QT_QPA_PLATFORM: offscreen
          PDF_WORKBENCH_REQUIRE_OCR: '1'
        run: python -m unittest discover -s tests -v
      - name: Keep test-only dependencies out of the app
        run: python -m pip uninstall --yes reportlab Pillow
      - name: Collect versioned licenses and corresponding-source manifest
        run: python packaging/collect_notices.py --output build/release-notices
      - name: Build the native app
        run: python packaging/build.py --release --notices build/release-notices
      - name: Audit bundled Linux libraries and their exact source packages
        if: runner.os == 'Linux'
        run: |
          python packaging/collect_notices.py --output build/release-notices --native-toc build/PDFWorkbench/Analysis-00.toc
          python -c "import shutil; shutil.copytree('build/release-notices', 'dist/PDFWorkbench/_internal/licenses', dirs_exist_ok=True)"
      - name: Verify bundled notices and Qt coverage
        run: python packaging/collect_notices.py --output build/release-notices --verify-bundle dist/PDFWorkbench
      - name: Test the frozen Linux app
        if: runner.os == 'Linux'
        env:
          QT_DEBUG_PLUGINS: '1'
          PDF_WORKBENCH_REQUIRE_OCR: '1'
        run: xvfb-run -a dist/PDFWorkbench/PDFWorkbench --self-test --output build/frozen-smoke
      - name: Test the frozen Windows app
        if: runner.os == 'Windows'
        env:
          PDF_WORKBENCH_REQUIRE_OCR: '1'
        shell: pwsh
        run: |
          $app = (Resolve-Path dist/PDFWorkbench/PDFWorkbench.exe).Path
          $out = Join-Path (Get-Location).Path 'build/frozen-smoke'
          $process = Start-Process -FilePath $app -ArgumentList @('--self-test', '--output', ('"' + $out + '"')) -Wait -PassThru
          $reports = @(Get-ChildItem -LiteralPath $out -Filter result.json -Recurse | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw | ConvertFrom-Json })
          if ($process.ExitCode -ne 0 -or $reports.Count -ne 1 -or $reports[0].result -ne 'PASS' -or -not $reports[0].frozen) {
            Get-ChildItem -LiteralPath $out -Filter test.log -Recurse | ForEach-Object { Get-Content -LiteralPath $_.FullName }
            throw 'Frozen Windows acceptance failed'
          }
      - name: Package the tested app
        run: python packaging/release.py --bundle dist/PDFWorkbench --notices build/release-notices --test-results build/frozen-smoke --output release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Linux'
        with:
          name: native-sources
          path: build/release-notices/native-sources.json
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.platform }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  sources:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: packaging/requirements-release.txt
      - run: python -m pip install -r packaging/requirements-release.txt
      - run: python -m pip uninstall --yes reportlab Pillow
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-sources
          path: build/native-source-input
      - name: Download and verify corresponding dependency sources
        run: python packaging/collect_notices.py --output build/source-notices --native-sources build/native-source-input/native-sources.json --sources-output release-assets
      - name: Archive the exact application source
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          git archive --format=tar.gz --prefix=PDFWorkbench/ --output="release-assets/PDFWorkbench-v${version}-source.tar.gz" HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sources
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 1
  publish:
    concurrency:
      group: release-materials
      cancel-in-progress: false
    needs: [build, sources]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Write checksums
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path('release-assets')
          tag = os.environ['GITHUB_REF_NAME']
          for suffix in ('windows-x86_64.zip', 'linux-x86_64.tar.gz', 'source.tar.gz'):
              if not (root / f'PDFWorkbench-{tag}-{suffix}').is_file():
                  raise SystemExit('Missing release asset: ' + suffix)
          manifest_path = root / 'source-manifest.json'
          sources = json.loads(manifest_path.read_text())
          renames = []
          destinations = set()
          for item in sources:
              filename = item['filename']
              path = root / filename
              if path.parent != root or not path.is_file():
                  raise SystemExit('Missing or unsafe corresponding source asset')
              normalized = re.sub(r'[^A-Za-z0-9._-]', '.', filename).strip('.')
              target = root / normalized
              if not normalized or normalized in destinations or (normalized != filename and os.path.lexists(target)):
                  raise SystemExit('Release source filename normalization collision')
              destinations.add(normalized)
              renames.append((item, path, target))
          for item, path, target in renames:
              if path != target:
                  os.link(path, target)
                  path.unlink()
                  item.setdefault('upstream_filename', item['filename'])
                  item['filename'] = target.name
          for item in sources:
              path = root / item['filename']
              if path.parent != root or not path.is_file() or path.stat().st_size != item['size']:
                  raise SystemExit('Missing or incomplete corresponding source asset')
              with path.open('rb') as stream:
                  digest = hashlib.sha256()
                  while chunk := stream.read(1024 * 1024):
                      digest.update(chunk)
                  if digest.hexdigest() != item['sha256']:
                      raise SystemExit('Source asset checksum mismatch')
          manifest_path.write_text(json.dumps(sources, indent=2) + '\n', encoding='utf-8')
          PY
          cd release-assets
          sha256sum * > SHA256SUMS
      - name: Publish app downloads and a separate verified source archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          notes="docs/releases/${RELEASE_TAG}.md"
          if [ ! -f "$notes" ]; then notes="CHANGELOG.md"; fi
          python packaging/publish_release.py create --tag "$RELEASE_TAG" --assets release-assets --notes-file "$notes"
