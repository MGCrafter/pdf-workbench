name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: packaging/requirements-release.txt
      - name: Install Linux display libraries and Poppler
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth poppler-utils ghostscript tesseract-ocr tesseract-ocr-eng tesseract-ocr-deu tesseract-ocr-osd libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 build-essential pkg-config libxml2-dev libxslt1-dev libffi-dev libjpeg-dev zlib1g-dev libtiff-dev libfreetype6-dev liblcms2-dev libopenjp2-7-dev libwebp-dev libharfbuzz-dev libfribidi-dev libraqm-dev
      - uses: ./.github/actions/acceptance-tools
      - name: Install Linux runtime with system image libraries
        if: runner.os == 'Linux'
        run: python -m pip install --no-binary=Pillow,cffi,lxml -r packaging/requirements-release.txt
      - name: Install Windows runtime
        if: runner.os == 'Windows'
        run: python -m pip install -r packaging/requirements-release.txt
      - name: Check Linux Qt platform dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin=$(python -c "from PyQt6.QtCore import QLibraryInfo; print(QLibraryInfo.path(QLibraryInfo.LibraryPath.PluginsPath) + '/platforms/libqxcb.so')")
          ldd "$plugin"
          if ldd "$plugin" | grep -q 'not found'; then exit 1; fi
      - name: Unit and UI regressions
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
      - name: Native Linux acceptance
        if: runner.os == 'Linux'
        env:
          QT_DEBUG_PLUGINS: '1'
        run: xvfb-run -a python packaging/smoke.py --output build/source-smoke
      - name: Native Windows acceptance
        if: runner.os == 'Windows'
        run: python packaging/smoke.py --output build/source-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-acceptance-${{ matrix.os }}
          path: |
            build/source-smoke/**/result.json
            build/source-smoke/**/test.log
            build/source-smoke/**/*.xml
          if-no-files-found: warn
          retention-days: 7
